name: Deploy to Production (Coolify)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip database migrations'
        required: false
        default: 'false'
        type: boolean

jobs:
  # Build and test
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      # ============ BACKEND ============
      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: Run backend tests
        working-directory: ./server
        run: npm run test:ci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: test-secret
          NODE_ENV: test

      - name: Build backend
        working-directory: ./server
        run: npm run build

      - name: Create backend archive
        working-directory: ./server
        run: |
          tar -czf ../backend.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='coverage' \
            --exclude='*.test.ts' \
            --exclude='*.spec.ts' \
            --exclude='prisma/migrations' \
            --exclude='src/**/*.test.ts' \
            --exclude='src/**/*.spec.ts' \
            -C . .

      # ============ FRONTEND ============
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Build frontend
        working-directory: ./client
        run: npm run build

      - name: Create frontend archive
        working-directory: ./client
        run: |
          tar -czf ../frontend.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='coverage' \
            --exclude='.next' \
            --exclude='*.test.ts' \
            --exclude='*.spec.ts' \
            --exclude='__tests__' \
            -C . .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend.tar.gz
            frontend.tar.gz

  # Trigger Coolify deployment
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Trigger Coolify Deployment
        run: |
          # Coolify API deployment
          # Update these in GitHub Secrets: COOLIFY_URL, COOLIFY_API_KEY
          
          COOLIFY_URL="${{ secrets.COOLIFY_URL }}"
          COOLIFY_API_KEY="${{ secrets.COOLIFY_API_KEY }}"
          APPLICATION_ID="${{ secrets.COOLIFY_APPLICATION_ID }}"
          
          echo "Triggering Coolify deployment..."
          
          # Check if we need to run migrations
          SKIP_MIGRATIONS="${{ github.event.inputs.skip_migrations }}"
          
          if [ "$SKIP_MIGRATIONS" != "true" ]; then
            echo "Running database migrations first..."
            
            # Create a temporary container to run migrations
            # This assumes Coolify has already deployed the new image
            # We'll trigger migrations via Coolify's exec feature or directly
            
            # Option 1: Use Coolify's deployment hook with migration flag
            curl -X POST "$COOLIFY_URL/api/v1/applications/$APPLICATION_ID/deploy" \
              -H "Authorization: Bearer $COOLIFY_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "forceRebuild": false,
                "commitMessage": "Deploy with migrations"
              }'
          else
            echo "Skipping migrations as requested"
            
            curl -X POST "$COOLIFY_URL/api/v1/applications/$APPLICATION_ID/deploy" \
              -H "Authorization: Bearer $COOLIFY_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "forceRebuild": false,
                "skipMigrations": true,
                "commitMessage": "Deploy without migrations"
              }'
          fi
          
          echo "Deployment triggered successfully!"

      - name: Wait for deployment and verify
        run: |
          COOLIFY_URL="${{ secrets.COOLIFY_URL }}"
          COOLIFY_API_KEY="${{ secrets.COOLIFY_API_KEY }}"
          APPLICATION_ID="${{ secrets.COOLIFY_APPLICATION_ID }}"
          
          echo "Waiting for deployment to complete..."
          
          # Poll deployment status (max 5 minutes)
          for i in {1..30}; do
            STATUS=$(curl -s "$COOLIFY_URL/api/v1/applications/$APPLICATION_ID/deployments/latest" \
              -H "Authorization: Bearer $COOLIFY_API_KEY" | jq -r '.status // "unknown"')
            
            echo "Deployment status: $STATUS"
            
            case "$STATUS" in
              "running")
                sleep 10
                ;;
              "completed")
                echo "Deployment successful!"
                exit 0
                ;;
              "failed"|"error")
                echo "Deployment failed!"
                curl -s "$COOLIFY_URL/api/v1/applications/$APPLICATION_ID/deployments/latest/logs" \
                  -H "Authorization: Bearer $COOLIFY_API_KEY"
                exit 1
                ;;
              *)
                echo "Unknown status, waiting..."
                sleep 10
                ;;
            esac
          done
          
          echo "Deployment verification timed out"
          exit 1
