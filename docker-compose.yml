# Optician Pro - Docker Configuration
# This setup includes PostgreSQL, Backend, and Frontend services

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: optician-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-optician}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-optician123}
      POSTGRES_DB: ${POSTGRES_DB:-optician_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-optician}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - optician-network

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: optician-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-optician}:${POSTGRES_PASSWORD:-optician123}@postgres:5432/${POSTGRES_DB:-optician_db}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      PORT: 8080
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/dist:/app/dist:ro
    networks:
      - optician-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: optician-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - optician-network

volumes:
  postgres_data:
    driver: local

networks:
  optician-network:
    driver: bridge
